[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blokus-duo-ai"
version = "0.1.0"
description = "AlphaZero-style AI for Blokus Duo (2-player, 14x14)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
train = ["torch>=2.0", "numba>=0.58", "tqdm>=4.0", "matplotlib>=3.6"]
gui = ["gradio>=4.0", "pillow>=9.0", "torch>=2.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["blokus_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
